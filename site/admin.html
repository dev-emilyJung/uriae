<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>방문 통계 · 우리애 한눈에</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin { max-width: 760px; padding: 40px 0 64px; }
    .admin h1 { font: 700 30px/1.3 var(--serif); margin: 0 0 4px; }
    .admin .when { color: var(--soft); font-size: 14px; margin: 0 0 32px; }
    .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
    .nums div { padding: 16px 16px 18px 0; }
    .nums b { display: block; font-size: 34px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .nums span { color: var(--soft); font-size: 14px; }
    .admin h2 { font: 700 19px/1.4 var(--serif); margin: 40px 0 10px; }
    .admin .note { color: var(--soft); font-size: 14px; margin: -6px 0 12px; }
    .bars { list-style: none; margin: 0; padding: 0; }
    .bars li { display: grid; grid-template-columns: 7.5em 1fr 3em; gap: 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
    .bars .bar { height: 10px; background: var(--pen); min-width: 2px; }
    .bars .n { text-align: right; font-variant-numeric: tabular-nums; }
    .bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bars.wide li { grid-template-columns: 12em 1fr 3em; }
    .empty { color: var(--soft); padding: 8px 0; }
    @media (max-width: 560px) {
      .nums b { font-size: 26px; }
      .bars.wide li { grid-template-columns: 8em 1fr 2.5em; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./"><img src="icon.png" width="28" height="28" alt="" />우리애 한눈에</a>
      <a href="admin-full.html" style="font-size:14px">자세한 통계</a>
    </header>

    <main class="admin">
      <h1>방문 통계</h1>
      <p class="when" id="when">불러오는 중</p>

      <div class="nums">
        <div><b id="visitors">-</b><span>방문자</span></div>
        <div><b id="home">-</b><span>홈 방문자</span></div>
        <div><b id="privacy">-</b><span>개인정보처리방침 방문자</span></div>
      </div>

      <h2>날짜별 방문자</h2>
      <ul class="bars" id="days"></ul>

      <h2>어디서 들어왔나</h2>
      <p class="note">다른 사이트의 링크를 눌러 들어온 방문입니다. 주소를 직접 입력하거나 앱에서 연 방문은 빠집니다.</p>
      <ul class="bars wide" id="refs"></ul>

      <h2>기기</h2>
      <ul class="bars wide" id="os"></ul>

      <p class="note" style="margin-top:40px">확장 프로그램 사용자 수는 여기서 알 수 없어요. 크롬 웹스토어 개발자 대시보드의 통계에서 확인하세요. 방문자 IP는 마지막 자리를 지워서 집계합니다.</p>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    function bars(target, rows, label) {
      const box = $(target);
      box.replaceChildren();
      if (!rows.length) { box.append(el('li', 'empty', '아직 기록이 없어요')); return; }
      const max = Math.max(...rows.map((r) => r.n));
      for (const r of rows) {
        const li = el('li');
        const bar = el('div', 'bar');
        bar.style.width = `${(r.n / max) * 100}%`;
        const wrap = el('div'); wrap.append(bar);
        li.append(el('span', 'name', label(r)), wrap, el('span', 'n', r.n.toLocaleString('ko-KR')));
        box.append(li);
      }
    }
    const dayLabel = (d) => {
      const m = String(d).match(/^(\d{4})(\d{2})(\d{2})$/);
      if (!m) return d;
      const dt = new Date(`${m[1]}-${m[2]}-${m[3]}T12:00:00+09:00`);
      return `${+m[2]}/${+m[3]} (${'일월화수목금토'[dt.getDay()]})`;
    };
    fetch('admin-data.json', { cache: 'no-store' })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((j) => {
        const g = j.general || {};
        $('when').textContent = g.start_date ? `${g.start_date} ~ ${g.end_date} · ${g.date_time} 갱신` : '아직 집계할 방문 기록이 없어요. 10분마다 다시 확인합니다.';
        $('visitors').textContent = (g.unique_visitors || 0).toLocaleString('ko-KR');
        const req = (j.requests && j.requests.data) || [];
        const vis = (path) => req.filter((r) => r.data === path || r.data.startsWith(path + '?')).reduce((s, r) => s + r.visitors.count, 0);
        $('home').textContent = (vis('/') + vis('/index.html')).toLocaleString('ko-KR');
        $('privacy').textContent = vis('/privacy.html').toLocaleString('ko-KR');
        const days = ((j.visitors && j.visitors.data) || []).map((d) => ({ d: d.data, n: d.visitors.count }))
          .sort((a, b) => String(b.d).localeCompare(String(a.d))).slice(0, 30);
        bars('days', days, (r) => dayLabel(r.d));
        const refs = ((j.referring_sites && j.referring_sites.data) || [])
          .filter((r) => !/emilysoft\.com$/.test(r.data)).map((r) => ({ d: r.data, n: r.visitors.count })).slice(0, 15);
        bars('refs', refs, (r) => r.d);
        const os = ((j.os && j.os.data) || []).map((r) => ({ d: r.data, n: r.visitors.count })).slice(0, 6);
        bars('os', os, (r) => r.d);
      })
      .catch(() => { $('when').textContent = '통계 파일을 아직 만들지 않았어요. 서버에서 uriae-update-admin 을 실행해 주세요.'; });
  </script>
</body>
</html>
