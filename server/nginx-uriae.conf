# /etc/nginx/sites-available/uriae  (ln -s 로 sites-enabled 에 연결)
server {
    listen 80;
    server_name uriae.emilysoft.com;

    root /var/www/uriae;
    index index.html;

    # 이 사이트 방문 기록만 따로 모음 (admin.html 분석용)
    access_log /var/log/nginx/uriae.access.log;

    # 관리자 통계 (admin.html, admin-data.json, admin-full.html): 비밀번호 필요, 검색엔진·캐시 제외
    location ~ ^/admin {
        auth_basic "uriae admin";
        auth_basic_user_file /etc/nginx/.uriae-admin;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
