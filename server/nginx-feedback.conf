# 의견 접수(server/feedback.py)로 넘기기. uriae 사이트의 server { } 안에서 include 한다.
# 연속 제출 제한 영역(uriae_feedback)은 nginx-feedback-zone.conf 에 있다.
location = /api/feedback {
    limit_req zone=uriae_feedback burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /api/feedback/summary {
    proxy_pass http://127.0.0.1:8787;
}

# 받은 의견 목록: 관리자 통계와 같은 비밀번호
location ^~ /api/admin/ {
    auth_basic "uriae admin";
    auth_basic_user_file /etc/nginx/.uriae-admin;
    add_header X-Robots-Tag "noindex, nofollow";
    proxy_pass http://127.0.0.1:8787;
}
