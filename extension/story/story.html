<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>성장 기록 — 우리애 한눈에</title>
  <link rel="stylesheet" href="../vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="story.css" />
</head>
<body>
  <!-- 화면에서만 보이는 조작 줄 (인쇄·PDF에는 안 나온다) -->
  <div class="bar">
    <label>아이 <select id="kid"></select></label>
    <label>학년 <select id="year"></select></label>
    <button id="make">만들기</button>
    <span id="status" class="status"></span>
    <span class="spacer"></span>
    <!-- 책을 만든 뒤에만 보이는 버튼 -->
    <span id="outs" class="outs" hidden>
    <button id="edit" class="ghost" aria-pressed="false" disabled>고치기</button>
    <button id="music" class="ghost" aria-pressed="false">♪ 음악 켜기</button>
    <button id="saveHtml" class="ghost" disabled title="사진과 음악이 든 파일 하나. 빠르고, 확장 없이 어느 컴퓨터에서나 열려요">HTML 파일로 받기 (추천)</button>
    <label title="한 해 전체는 100쪽이 넘어 인쇄 미리보기가 오래 걸려요. 계절별로 나눠 저장하면 빨라요">PDF 범위
      <select id="part">
        <option value="spring">봄 (표지·처음의 순간들·3~5월)</option>
        <option value="summer">여름 (6~8월)</option>
        <option value="autumn">가을 (9~11월)</option>
        <option value="winter">겨울 (12~2월·마지막 장)</option>
        <option value="all">한 해 전체 (느림)</option>
      </select></label>
    <button id="print" disabled>PDF로 저장</button>
    </span>
    <div id="progress" class="progress" hidden>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div>
      <span class="label"></span>
    </div>
  </div>
  <main id="book">
    <div class="empty">
      <h1>한 해의 알림장을<br />한 권의 책으로</h1>
      <p>위에서 학년을 고르고 <b>만들기</b>를 눌러 주세요.</p>
      <small>알림장과 사진은 이 컴퓨터 안에서만 읽어요</small>
    </div>
  </main>
  <details class="dev"><summary>개발: 알림장 항목 이름 (0~2세 식사·수면 칸이 있는지)</summary><pre id="fields"></pre></details>
  <audio id="audio" preload="none"></audio>
  <script type="module" src="story.js"></script>
</body>
</html>
